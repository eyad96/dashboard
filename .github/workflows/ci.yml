name: CI Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    name: Lint, Typecheck, Build, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Convex Code
        run: npx convex codegen

      - name: Code Linting
        run: pnpm lint

      - name: TypeScript Static Analysis (Frontend)
        run: npx tsc --noEmit

      - name: TypeScript Static Analysis (Convex Backend)
        run: npx convex typecheck

      - name: Verify Production Compilation
        run: pnpm build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_mock_clerk_key' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_mock_clerk_secret' }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL || 'https://mock-org.convex.cloud' }}
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT || 'convex-mock-deployment' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'mock-gemini-ai-api-key' }}

      - name: Execute Unit Test Suite
        run: pnpm test
